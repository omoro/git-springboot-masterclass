name: Task Management API CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/omoro/git-springboot-masterclass:latest
            ghcr.io/omoro/git-springboot-masterclass:${{ github.sha }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-management-api
          path: target/*.jar

  deploy:
    name: Deploy to local Kubernetes
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, x64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl kustomize k8s/ \
            | sed "s|ghcr.io/omoro/git-springboot-masterclass:latest|ghcr.io/omoro/git-springboot-masterclass:${GITHUB_SHA}|g" \
            | kubectl apply -f -

      - name: Verify deployment
        run: kubectl rollout status deployment/task-management-api --timeout=120s
