apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-management-api
  labels:
    app:  task-management-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-management-api

  template:
    metadata:
      labels:
        app: task-management-api

    spec:
      containers:
        - name: task-management-api
          image: ghcr.io/omoro/git-springboot-masterclass:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8181

          envFrom:
            - configMapRef:
                name: task-management-api-config
            - secretRef:
                name: task-management-api-secret

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8181
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8181
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8181
            periodSeconds: 5

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

