apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: task-management-api-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: task-api.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: task-management-api
                port:
                  number: 8181